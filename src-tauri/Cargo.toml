[package]
name = "terax"
version = "0.8.6"
description = "Terax — an open-source AI-native terminal emulator"
authors = ["crynta"]
license = "Apache-2.0"
edition = "2021"
default-run = "terax"

[workspace]
members = ["crates/terax-cli", "crates/terax-control-protocol"]
default-members = [".", "crates/terax-cli", "crates/terax-control-protocol"]
resolver = "2"

[workspace.package]
version = "0.8.6"
edition = "2021"
license = "Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "terax_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
# macos-private-api backs the transparent window NSVisualEffectView needs.
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
terax-control-protocol = { path = "crates/terax-control-protocol" }
portable-pty = "0.9"
dirs = "6"
log = "0.4"
ignore = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
grep-matcher = "0.1"
globset = "0.4"
nucleo-matcher = "0.3"
shared_child = "1"
tauri-plugin-log = "2"
tauri-plugin-os = "2"
tauri-plugin-store = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
reqwest = { version = "0.12", default-features = false, features = [
	"rustls-tls",
	"stream",
] }
bytes = "1"
futures-util = "0.3"
tokio = { version = "1", default-features = false, features = ["rt"] }
tempfile = "3"
notify = "8.2.0"
which = "8.0.4"

[dev-dependencies]
proptest = "1"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = [
	"apple-native",
] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSUserDefaults"] }
window-vibrancy = "0.8"

# WebKitGTK can't read external clipboard copies; mac/win webviews can.
[target.'cfg(target_os = "linux")'.dependencies]
tauri-plugin-clipboard-manager = "2"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", default-features = false, features = [
	"windows-native",
] }
window-vibrancy = "0.8"
windows-sys = { version = "0.61", features = [
	"Wdk_System_SystemServices",
	"Win32_Foundation",
	"Win32_Security",
	"Win32_System_Console",
	"Win32_System_JobObjects",
	"Win32_System_SystemInformation",
	"Win32_System_ProcessStatus",
	"Win32_System_Threading",
	"Win32_System_Diagnostics_ToolHelp",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
# 这里不能设 panic = "abort"。wry 往 WKURLSchemeTask 回数据时,任务可能刚好被停掉
# (刷新页面、关弹框而请求还在飞),WebKit 会抛 NSInternalInconsistencyException;
# 这个竞态在 wry 内部堵不住,它的兜底是把 didReceiveResponse/didReceiveData/didFinish
# 逐个包进 objc2::exception::catch,而 catch 依赖异常能 unwind 到 C helper 的 @catch。
# 一旦 panic = "abort",extern "C-unwind" 边界退化成 nounwind,异常还没到 @catch 就被
# abort guard 拦下 —— 兜底失效,整个应用没了。8/27、8/28、8/31、9/1 四次闪退都是它。
# 只剥 DWARF,留下符号表:崩溃报告里的栈才有函数名可读。全剥(strip = true)之后
# 那份 .ips 就只剩一串地址,而 release 的代码布局跟随便重编一个二进制对不上,
# 事后没法补符号 —— 为这个多出的两三 MB 值。
strip = "debuginfo"

# rust-lang/rust#110536: stripping proc-macro dylibs breaks the dlopen rustc does
# at compile time on macOS, reported as a bogus E0463. Never shipped, so nothing to strip.
[profile.release.build-override]
strip = false
